<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f7f5">
  <title>Karteikarten</title>
  <link rel="stylesheet" href="style.css">
  <!-- KaTeX für Formeln im LaTeX-Stil -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">

  <!-- Installierbar als App (Android + iPhone) -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Karteikarten">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <script>
    // Theme vor dem ersten Rendern setzen (kein Aufblitzen)
    try {
      var t = localStorage.getItem('kk.theme');
      if (t) document.documentElement.setAttribute('data-theme', JSON.parse(t));
    } catch (e) {}
  </script>
</head>
<body>
  <div id="app"></div>

  <!-- Lernsets aus deinen Skripten + App; immer frisch laden, damit neue Karten sofort erscheinen -->
  <script>
    ['https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js', 'decks.js', 'decks/schaltungstheorie.js', 'decks/computertechnik.js', 'app.js'].forEach(function (src) {
      var s = document.createElement('script');
      s.src = /^https:/.test(src) ? src : src + '?v=' + Date.now();
      s.async = false;
      document.body.appendChild(s);
    });
    // Service Worker: Offline-Nutzung + Installierbarkeit (nur über https/localhost)
    if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
      addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function () {});
      });
    }
  </script>
</body>
</html>
