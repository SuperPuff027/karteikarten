<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f7f5">
  <title>Karteikarten</title>
  <link rel="stylesheet" href="style.css">

  <!-- Installierbar als App (Android + iPhone) -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Karteikarten">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <script>
    // Theme vor dem ersten Rendern setzen (kein Aufblitzen)
    try {
      var t = localStorage.getItem('kk.theme');
      if (t) document.documentElement.setAttribute('data-theme', JSON.parse(t));
    } catch (e) {}
  </script>
</head>
<body>
  <div id="app"></div>

  <div id="rotate-hint" aria-hidden="true">
    <div class="rotate-box">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1"><rect x="7" y="2" width="10" height="20" rx="1.5"/><path d="M3 12a9 9 0 0 1 4-7.5M21 12a9 9 0 0 1-4 7.5"/></svg>
      <p>Gerät ins Querformat drehen</p>
      <button class="btn ghost" data-action="exit-study">Zurück zum Menü</button>
    </div>
  </div>

  <!-- Lernsets aus deinen Skripten + App; immer frisch laden, damit neue Karten sofort erscheinen -->
  <script>
    ['decks.js', 'app.js'].forEach(function (src) {
      var s = document.createElement('script');
      s.src = src + '?v=' + Date.now();
      s.async = false;
      document.body.appendChild(s);
    });
    // Service Worker: Offline-Nutzung + Installierbarkeit (nur über https/localhost)
    if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
      addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function () {});
      });
    }
  </script>
</body>
</html>
